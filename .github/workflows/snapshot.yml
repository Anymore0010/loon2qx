name: Snapshot

# The profile depends on ~59 third-party resources across several upstream repos.
# If one is deleted or force-pushed, the profile silently loses rules. This job
# refreshes the frozen mirror in snapshot/ weekly so there is always a working
# copy, which the single generated profile points at.
#
# A single broken upstream must NOT block the refresh: the other resources are
# still worth mirroring. So the job commits whatever succeeded and only then
# reports failure (which emails the repo owner).

on:
  schedule:
    # 03:17 UTC every Monday (off the top of the hour to avoid the Actions rush).
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerate profile from manifest
        run: bun tools/build.mjs

      # Converts upstream Loon/Surge rule lists into native QX rules committed
      # in QuantumultX/rules/, so the profile no longer needs the runtime parser.
      # Exits 0 even if some upstreams fail (recorded in snapshot/index.json);
      # the final step turns those into a failing run after the commit.
      # 顺序很重要：所有「生成 QuantumultX/rules/*」的步骤必须排在 fetch-snapshot 之前——
      # fetch-snapshot 的脚本发现阶段要扫描这些文件，才能把其中引用的脚本一并镜像。
      # 顺序反了会导致新生成的规则脚本永远直链上游、不受快照保护（会静默失效）。
      - name: Vendor Loon/Surge rule lists
        run: bun tools/vendor-rules.mjs

      # 从插件包提取 URL 级重写（去重基线取自仓库内已有快照，故无需先跑 fetch-snapshot）。
      - name: Re-extract plugin rewrites
        run: bun tools/extract-plugin.mjs --all

      - name: Mirror upstream resources
        run: bun tools/fetch-snapshot.mjs

      - name: Validate generated profiles
        run: bun tools/validate.mjs

      - name: Summarise mirror result
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("snapshot/index.json")
          if not p.exists():
              print("### Snapshot failed: snapshot/index.json missing")
              raise SystemExit(0)
          i = json.loads(p.read_text())
          print(f"### Snapshot: {i['mirrored']}/{i['total']} mirrored, {i['failed']} failed")
          vp = pathlib.Path("QuantumultX/rules/status.json")
          if vp.exists():
              v = json.loads(vp.read_text())
              print(f"\n### Rules: {v['ok']}/{v['total']} converted, {v['rules']} rules, {v['failed']} failed")
          bad = [r for r in i["resources"] if r.get("error")]
          if bad:
              print("\n| resource | upstream URL | error |")
              print("|---|---|---|")
              for r in bad:
                  print(f"| `{r['id']}` | {r['url']} | {r['error']} |")
          PY

      - name: Commit refreshed snapshot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A snapshot QuantumultX
          if git diff --cached --quiet; then
            echo "No upstream changes."
          else
            git commit -m "chore(snapshot): weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      # Runs after the commit so a broken upstream still leaves a usable snapshot,
      # while still marking the run red so it gets noticed.
      - name: Fail if any upstream resource is broken
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          failed = 0

          mirror = pathlib.Path("snapshot/index.json")
          if mirror.exists():
              i = json.loads(mirror.read_text())
              if i["failed"]:
                  failed += i["failed"]
                  print(f"::error::{i['failed']} upstream resource(s) failed to mirror")
                  for r in i["resources"]:
                      if r.get("error"):
                          print(f"::error title={r['id']}::{r['url']} -> {r['error']}")

          # Vendored rule lists are a separate pipeline; check them too, otherwise
          # a deleted upstream would rot silently while the job stayed green.
          vendored = pathlib.Path("QuantumultX/rules/status.json")
          if vendored.exists():
              v = json.loads(vendored.read_text())
              if v["failed"]:
                  failed += v["failed"]
                  print(f"::error::{v['failed']} vendored rule source(s) failed")
                  for r in v["resources"]:
                      if r.get("error"):
                          print(f"::error title={r['id']}::{r['upstream']} -> {r['error']}")

          if failed:
              sys.exit(1)
          print("All upstream resources mirrored and all rule lists converted.")
          PY
