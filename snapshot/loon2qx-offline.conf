# Quantumult X 离线配置 —— 所有远程资源均指向本仓库 snapshot/ 快照
# 生成时间：2026-09-25T07:43:38.667Z
# 用途：上游仓库失效时仍可使用。导入后仍需自行添加订阅链接并信任证书。
# 重新生成：GitHub Actions → Snapshot（每周自动）或本地 `bun tools/fetch-snapshot.mjs`

########################################################################
# 常规设置
########################################################################
[general]
resource_parser_url=https://raw.githubusercontent.com/Anymore0010/loon2qx/master/snapshot/github.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
profile_img_url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/QuantumultX.png
server_check_url=http://www.gstatic.com/generate_204
server_check_timeout=3000
network_check_url=http://connectivitycheck.platform.hicloud.com/generate_204
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/Anymore0010/loon2qx/master/snapshot/github.com/KOP-XIAO/QuantumultX/master/Scripts/server-info-plus.js
dns_exclusion_list=*.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com
excluded_routes=10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 239.255.255.250/32, 255.255.255.255/32
fallback_udp_policy=direct
udp_drop_list=443

########################################################################
# DNS
########################################################################
[dns]
doh-server=https://dns.alidns.com/dns-query, https://doh.pub/dns-query, https://dns.google/dns-query

########################################################################
# 策略组
########################################################################
[policy]
static=香港节点, resource-tag-regex=., server-tag-regex=^(?=.*((?i)🇭🇰|香港|(\b(HK|Hong)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png
static=台湾节点, resource-tag-regex=., server-tag-regex=^(?=.*((?i)🇹🇼|台湾|(\b(TW|Tai|Taiwan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png
static=日本节点, resource-tag-regex=., server-tag-regex=^(?=.*((?i)🇯🇵|日本|川日|东京|大阪|泉日|埼玉|(\b(JP|Japan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png
static=韩国节点, resource-tag-regex=., server-tag-regex=^(?=.*((?i)🇰🇷|韩国|韓|首尔|(\b(KR|Korea)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/KR.png
static=新国节点, resource-tag-regex=., server-tag-regex=^(?=.*((?i)🇸🇬|新加坡|狮|(\b(SG|Singapore)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png
