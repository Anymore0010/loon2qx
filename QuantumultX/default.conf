# Quantumult X 配置 —— 自动生成，请勿手工编辑
# 改 tools/sources.json 后运行 `bun tools/build.mjs` 重新生成。

########################################################################
# 常规设置
########################################################################
[general]

resource_parser_url=https://raw.githubusercontent.com/Anymore0010/proxy-profile/master/snapshot/github.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
profile_img_url=https://raw.githubusercontent.com/Anymore0010/proxy-profile/master/snapshot/github.com/fmz200/wool_scripts/main/icons/apps/QuantumultX.png
# 节点测速 URL，超时 2000ms
server_check_url=http://www.gstatic.com/generate_204
server_check_timeout=2000
# 网络连通性检测 URL
network_check_url=http://connectivitycheck.platform.hicloud.com/generate_204
# 节点页顶部的地理位置信息展示
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/Anymore0010/proxy-profile/master/snapshot/github.com/KOP-XIAO/QuantumultX/master/Scripts/server-info-plus.js
# 这些域名不使用 fake-ip，避免本地/内网域名被劫持
dns_exclusion_list=*.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com
# 这些流量不交给 Quantumult X 处理
excluded_routes=10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 255.255.255.255/32
# UDP 兜底：节点不支持 UDP 中转时使用。
fallback_udp_policy=reject
# 丢弃这些 UDP 端口（QUIC 等），避免与 TCP 分流策略不一致
udp_drop_list=443

########################################################################
# DNS
########################################################################
[dns]

# 加密 DNS（DoH）。注意：设置后将忽略未绑定域名的明文 server；兜底走系统 DNS。
# 保留 IPv6（不写 no-ipv6）。
# 优先使用 DNS over HTTP/3；失败时自动回落 HTTP/2（QX 内置回落）。
prefer-doh3
# 多个 doh-server 写在同一行、逗号分隔（并发查询，多路提高可用性）。
doh-server=https://dns.alidns.com/dns-query, https://doh.pub/dns-query

# 明文 UDP DNS 兜底安全网（保留，勿删）：
# 官方文档称设了 doh-server 后未绑定域名的明文 server 会被忽略；
# 保留是因为代价为零，且 DoH 异常时可回落。
server = 223.5.5.5
server = 119.29.29.29

