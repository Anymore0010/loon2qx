########################################################################
# 本地节点
########################################################################
[server_local]

# 本配置无本地节点（节点全部来自订阅）。
# 本段必须保留：Quantumult X 缺少 [server_local] 会报「缺少模块 server_local」而无法导入。
# 如需添加本地节点，按下面的写法（去掉注释符）：
#     shadowsocks=example.com:443, method=chacha20-ietf-poly1305, password=PWD, udp-relay=true, tag=Local-01

########################################################################
# 节点订阅
########################################################################
[server_remote]

# 订阅链接属于个人敏感信息，刻意不写入本仓库。
# 在 Quantumult X 里手动添加：风车 → 节点 → 添加订阅；或在本段末尾新起一行粘贴（不要以 # 开头）。
# 解析器会自动把 Clash / Surge 等格式的订阅转成 Quantumult X 节点。

# 示例（照抄一行并把链接换成你自己的，不需要「取消注释」）：
#     <你的订阅链接>, tag=MyNodes, opt-parser=true, update-interval=86400, enabled=true
# 上面这行必须以「链接」开头；若行首带 # 就会被 QX 当成注释而静默忽略。

