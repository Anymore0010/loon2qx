# Quantumult X 配置 —— 由 Loon 配置转换而来
# 生成来源：tools/sources.json（请勿手工编辑本文件，改 sources.json 后运行 `bun tools/build.mjs`）
# 原始 Loon 配置：loon_config/*.lcf
# 插件替换说明：MAPPING.md

########################################################################
# 常规设置
########################################################################
[general]

# 从 Loon [General] 转换而来：只保留 Quantumult X 有对应语义的项。
resource_parser_url=https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
profile_img_url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/QuantumultX.png
# 节点测速：URL 对应 Loon proxy-test-url，超时 3000ms
server_check_url=http://www.gstatic.com/generate_204
server_check_timeout=3000
# 对应 Loon internet-test-url
network_check_url=http://connectivitycheck.platform.hicloud.com/generate_204
# 对应 Loon geoip-url / ipasn-url 的用途：节点页顶部信息展示
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/server-info-plus.js
# 这些域名不使用 fake-ip，避免本地/内网域名被劫持
dns_exclusion_list=*.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com
# 对应 Loon bypass-tun：这些流量不交给 Quantumult X 处理
excluded_routes=10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 239.255.255.250/32, 255.255.255.255/32
# UDP 兜底：节点不支持 UDP 中转时使用（Loon 原为 reject，此处沿用融合配置的 direct）
fallback_udp_policy=direct
# 丢弃这些 UDP 端口（QUIC 等），避免与 TCP 分流策略不一致
udp_drop_list=443

########################################################################
# DNS
########################################################################
[dns]

# 对应 Loon [General] doh-server。设置了 doh-server 后 non-encrypted server 会被忽略。
# Loon ip-mode = dual / ipv6-vif = auto，因此这里刻意不写 no-ipv6。
# 官方要求多个 doh-server 写在同一行、以逗号分隔（并发查询）。
doh-server=https://dns.alidns.com/dns-query, https://doh.pub/dns-query, https://dns.google/dns-query

# 按域名指定 DNS。官方文档：doh-server 只忽略「未绑定域名」的普通 server，
# 这些绑定了域名的规则仍然生效。路由管理页用 system，避免在外网 DNS 下打不开后台。
server=/*itunes.apple.com/system
server=/dl.google.com/119.29.29.29
server=/dl.l.google.com/119.29.29.29
server=/update.googleapis.com/119.29.29.29
server=/*.dl.playstation.net/119.29.29.29
server=/amplifi.lan/system
server=/router.synology.com/system
server=/sila.razer.com/system
server=/router.asus.com/system
server=/routerlogin.net/system
server=/orbilogin.com/system
server=/www.LinksysSmartWiFi.com/system
server=/LinksysSmartWiFi.com/system
server=/myrouter.local/system
server=/www.miwifi.com/system
server=/miwifi.com/system
server=/mediarouter.home/system
server=/tplogin.cn/system
server=/tplinklogin.net/system
server=/melogin.cn/system
server=/falogin.cn/system
server=/liquidlink.cn/119.29.29.29

########################################################################
