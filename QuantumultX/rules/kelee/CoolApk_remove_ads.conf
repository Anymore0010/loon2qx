# 酷安去广告  —— 由 vendor/loon-plugins/CoolApk_remove_ads.lpx 自动转换（tools/convert-plugins.mjs）
# 源插件: https://kelee.one/Tool/Loon/Lpx/CoolApk_remove_ads.lpx
# 源配置里 enabled=true
# 请勿手工编辑：改源插件后重新运行 bun tools/fetch-plugins.mjs && bun tools/convert-plugins.mjs

^https:\/\/api\.coolapk\.com\/v6\/search\?.*type=hotSearch url reject-dict
^https:\/\/api\.coolapk\.com\/v6\/feed\/detail\? url jsonjq-response-body '.data.hotReplyRows |= if . then map(select(.id?)) else . end | .data.topReplyRows |= if . then map(select(.id?)) else . end | reduce ("detailSponsorCard", "include_goods", "include_goods_ids") as $key (.; .data[$key]=[])'
^https:\/\/api\.coolapk\.com\/v6\/main\/dataList url jsonjq-response-body '.data |= (if (type=="array" and length>0) then map(select((.entityTemplate!="sponsorCard") and (.title!="精选配件"))) else . end)'
^https:\/\/api\.coolapk\.com\/v6\/page\/dataList url jsonjq-response-body 'if (.data | length > 0) then .data |= map(select((.title? != "酷安热搜") and (.entityTemplate? != "imageScaleCard") and (.entityTemplate? != "sponsorCard"))) else . end'
^https:\/\/api\.coolapk\.com\/v6\/main\/indexV8 url jsonjq-response-body '.data |= (if length > 0 then map(select((.entityTemplate != "sponsorCard") and ([8639,29349,33006,32557] | index(.entityId) | not) and ((.title // "" | test("值得买|红包")) | not))) else . end)'
^https:\/\/api\.coolapk\.com\/v6\/main\/init url jsonjq-response-body '.data |= map(select(.entityId? | [944,945,6390] | index(.) | not) | if .entityId == 20131 then .entities |= map(select(.title != "酷品")) else . end)'

hostname = api.coolapk.com
